<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14812a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo192.png">
<title>Checklist de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: practical field tool, clear and calm, big targets for gloved hands in the sun
   IDEA: the surveyor's field notebook (caderneta de campo) as a checklist
   PICTURE: the working checklist itself, with a progress meter per stage
   COLOUR and TYPE: brand green from the logo, white ground, dark ink; Barlow (signage lettering)
   LAYOUT: one column, sticky progress bar, sections as notebook pages */
:root{color-scheme:light dark;--bg:light-dark(#f4f6f3,#0e1410);--card:light-dark(#fff,#162019);--ink:light-dark(#14201a,#e8efe9);--mut:light-dark(#5b6b61,#9cb0a3);--line:light-dark(#dde5df,#26342b);--g:#14812a;--g2:light-dark(#e3f3e5,#1b3a22);--warn:#c2410c;--warnbg:light-dark(#fff1e8,#3a1f10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{background:var(--g);color:#fff;padding:14px 16px}
header .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
header img{width:48px;height:48px;border-radius:50%;background:#fff;padding:3px}
header h1{font-size:24px}header .in>div:nth-child(2){flex:1}.usr{text-align:right;font-size:14px}.usr button{min-height:36px;padding:4px 12px;margin-top:4px;background:rgba(255,255,255,.18);color:#fff;font-size:14px}.login{max-width:400px;margin:32px auto}.login label{margin-top:10px}.err{color:var(--warn);font-weight:600;min-height:1.5em}input[type=email],input[type=password]{width:100%;font:16px Barlow,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}header p{margin:0;font-size:14px;opacity:.9}
button,.btn{font:600 16px Barlow,sans-serif;min-height:48px;border-radius:12px;border:0;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:var(--g);color:#fff}.sec{background:var(--g2);color:var(--ink)}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible,label.item:focus-within{outline:3px solid #f5b400;outline-offset:2px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:20px 0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;display:block;min-height:0;color:var(--ink)}
.stage h2{font-size:26px;color:var(--g);margin:6px 0}.stage p{margin:0;color:var(--mut);font-weight:400}
.stage svg{width:40px;height:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.card h3{font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.card h3 small{font:500 14px Barlow;color:var(--mut);white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
label.f{display:block;font-size:14px;color:var(--mut);font-weight:500}
input[type=text],input[type=date],textarea{width:100%;font:16px Barlow,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
textarea{min-height:84px;resize:vertical}
label.item{display:flex;gap:12px;align-items:flex-start;padding:12px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
label.item:first-of-type{border-top:0}
label.item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;margin-top:-2px;transition:background .15s}
.box svg{width:18px;height:18px;opacity:0}
label.item input:checked+.box{background:var(--g);border-color:var(--g)}
label.item input:checked+.box svg{opacity:1}
label.item input:checked~span{color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.bar .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--g);transition:width .25s}
.pend{background:var(--warnbg);border-color:var(--warn)}
.pend h3{color:var(--warn)}
.pend ul{margin:0 0 10px;padding-left:20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.hist{list-style:none;padding:0;margin:0}
.hist li{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist li:first-child{border-top:0}
.tag{font-size:13px;font-weight:600;border-radius:20px;padding:2px 10px;background:var(--g2);white-space:nowrap}
.tag.w{background:var(--warnbg);color:var(--warn)}
.mut{color:var(--mut);font-size:14px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.45 ui-monospace,monospace;max-height:340px;overflow:auto}
.link{background:none;border:0;color:var(--g);font:600 15px Barlow;padding:8px 0;min-height:0;text-decoration:underline;cursor:pointer}select{width:100%;font:16px Barlow,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}.ok{color:var(--g);font-weight:600}.users{list-style:none;margin:0;padding:0}.users li{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}.users li:first-child{border-top:0}.users .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.users select{width:auto;margin:0;padding:6px 10px}.users button{min-height:40px;padding:6px 12px;font-size:14px}.nav{display:flex;gap:8px;margin:16px 0 0}.nav button{flex:1}.nav .on{background:var(--g);color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}
function confirmInline(b){if(b.dataset.sure)return true;b.dataset.sure=1;b.querySelector('p').textContent='Há um checklist em andamento. Toque de novo para descartá-lo e começar outro.';return false}
function novo(st){const last=ls.get('cc_last',{});const gs=ls.get('cc_gestores',[]),lg=gs.find(g=>g.id===last.resp_id);cur={st,inicio:Date.now(),info:{resp:lg?lg.nome:'',resp_id:lg?lg.id:'',equipe:last.equipe||'',veiculo:last.veiculo||'',os:'',local:''},marc:{},obs:''};save();form()}
function save(){ls.set('cc_draft',cur)}
function form(){
  const S=STAGES[cur.st];let n=0;
  app.innerHTML=`<div class="bar"><div class="row"><button class="ghost" id="voltar">‹ Início</button><b id="cnt"></b></div><div class="meter"><i id="mt"></i></div></div>
  <h2 style="font-size:30px;margin:18px 0 4px">${S.nome}</h2><p class="mut" style="margin:0">Toque em cada item para marcar como conferido.</p>
  <div class="card"><h3>Dados da equipe</h3><div class="fields">${FIELDS.map(([k,l])=>k==='resp'?`<label class="f">${l}<select id="f_resp"><option value="">Selecione o gestor</option>${ls.get('cc_gestores',[]).map(g=>`<option value="${esc(g.id)}" ${cur.info.resp_id===g.id?'selected':''}>${esc(g.nome)}</option>`).join('')}</select></label>`:`<label class="f">${l}<input type="text" id="f_${k}" data-k="${k}" value="${esc(cur.info[k])}"></label>`).join('')}</div></div>
  ${S.secoes.map((s,si)=>`<div class="card"><h3>${s[0]}<small id="sc${si}"></small></h3>${s[1].map((it,ii)=>{const id=si+'.'+ii;return`<label class="item"><input type="checkbox" data-id="${id}" ${cur.marc[id]?'checked':''}><span class="box">${CHECK}</span><span>${it}</span></label>`}).join('')}</div>`).join('')}
  <div class="card"><h3>Observações</h3><textarea id="obs" placeholder="Pendências, avarias, itens emprestados, ocorrências...">${esc(cur.obs)}</textarea></div>
  <div id="pend"></div>
  <div class="actions"><button class="pri" id="fin" style="flex:1">Concluir checklist</button></div>`;
  app.querySelectorAll('input[type=text]').forEach(i=>i.oninput=()=>{cur.info[i.dataset.k]=i.value;save()});
  $('#f_resp').onchange=e=>{const g=ls.get('cc_gestores',[]).find(x=>x.id===e.target.value);cur.info.resp_id=g?g.id:'';cur.info.resp=g?g.nome:'';save()};
  $('#obs').oninput=e=>{cur.obs=e.target.value;save()};
  app.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{c.checked?cur.marc[c.dataset.id]=Date.now():delete cur.marc[c.dataset.id];save();prog();$('#pend').innerHTML=''});
  $('#voltar').onclick=home;$('#fin').onclick=()=>concluir(false);
  prog();scrollTo(0,0);
}
function prog(){const S=STAGES[cur.st],t=total(cur.st),ok=Object.keys(cur.marc).length;$('#cnt').textContent=`${ok} de ${t}`;$('#mt').style.width=(ok/t*100)+'%';S.secoes.forEach((s,si)=>{const k=s[1].filter((_,ii)=>cur.marc[si+'.'+ii]).length;$('#sc'+si).textContent=`${k}/${s[1].length}`})}
function pendentes(r){const out=[];STAGES[r.st].secoes.forEach((s,si)=>s[1].forEach((it,ii)=>{if(!r.marc[si+'.'+ii])out.push(it)}));return out}
function concluir(forcar){
  if(!cur.info.resp_id){toast('Selecione o responsável');$('#f_resp').focus();return}
  const p=pendentes(cur);
  if(p.length&&!forcar){$('#pend').innerHTML=`<div class="card pend"><h3>${p.length} item${p.length>1?'s':''} sem conferência</h3><ul>${p.map(x=>`<li>${x}</li>`).join('')}</ul><p class="mut">Para concluir mesmo assim, explique o motivo nas observações.</p><button class="sec" id="force">Concluir com pendências</button></div>`;$('#force').onclick=()=>{if(!cur.obs.trim()){toast('Escreva o motivo nas observações');$('#obs').focus();return}concluir(true)};$('#pend').scrollIntoView({behavior:'smooth'});return}
  const r={...cur,user:{id:sess.id,email:sess.email,nome:sess.nome},id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),env:false,fim:Date.now(),ok:Object.keys(cur.marc).length,tot:total(cur.st)};
  const h=ls.get('cc_hist',[]);h.unshift(r);ls.set('cc_hist',h.slice(0,200));
  ls.set('cc_last',{resp_id:r.info.resp_id,equipe:r.info.equipe,veiculo:r.info.veiculo});ls.set('cc_draft',null);resumo(r,true);sync();
}
function payload(r){const S=STAGES[r.st];return{client_id:r.id,etapa:r.st,responsavel:r.info.resp,equipe:r.info.equipe||null,veiculo:r.info.veiculo||null,ordem_servico:r.info.os||null,local:r.info.local||null,itens_ok:r.ok,itens_total:r.tot,pendencias:pendentes(r),itens:S.secoes.map((s,si)=>({secao:s[0],itens:s[1].map((it,ii)=>({item:it,ok:!!r.marc[si+'.'+ii],em:r.marc[si+'.'+ii]?new Date(r.marc[si+'.'+ii]).toISOString():null}))})),observacoes:r.obs||null,iniciado_em:new Date(r.inicio).toISOString(),concluido_em:new Date(r.fim).toISOString(),usuario_id:r.user?.id,responsavel_id:r.info.resp_id||null,usuario_nome:r.user?.nome||null}}
let syncing=false;
async function sync(){
  if(syncing||!sess||!sess.perfil||SUPA_URL.startsWith('__'))return;syncing=true;
  try{const tk=await token();if(!tk)return;
  const h=ls.get('cc_hist',[]);let mud=0,mail=0;
  for(const r of h){if(!r.id)continue;if(!r.user)r.user={id:sess.id,email:sess.email,nome:sess.nome};if(r.user.id!==sess.id)continue;
    if(!r.env){try{const res=await fetch(SUPA_URL+'/rest/v1/checklists',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload(r))});
      if(res.ok||res.status===409){r.env=true;mud++}else break}catch(e){break}}
  }
  if(mud||mail){ls.set('cc_hist',h);toast(mud>1?mud+' checklists enviados':'Checklist enviado');if(!cur&&$('.stages'))home();const e=$('#envst');if(e){const r=h.find(x=>x.id===e.dataset.id);if(r)e.textContent=envTxt(r)}}
  }finally{syncing=false}
}
function waNum(r){const g=ls.get('cc_gestores',[]).find(x=>x.id===r.info.resp_id);let n=(g?.celular||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;return n}
function envTxt(r){return r.env?'Salvo no sistema.':'Sem internet: será salvo no sistema automaticamente quando o sinal voltar. O WhatsApp pode ser enviado agora.'}
addEventListener('online',sync);setInterval(sync,60000);
function textoWa(r){const S=STAGES[r.st],p=pendentes(r);let t=`*Checklist de campo: ${S.nome}*\nConcluído em ${fmt(r.fim)}\n`;FIELDS.forEach(([k,l])=>{if(r.info[k])t+=`${l}: ${r.info[k]}\n`});t+=p.length?`\n*${r.ok} de ${r.tot} itens conferidos. ${p.length} pendência(s):*\n${p.map(x=>'❌ '+x).join('\n')}\n`:`\n✅ Todos os ${r.tot} itens conferidos.\n`;if(r.obs)t+=`\nObservações: ${r.obs}\n`;if(r.user)t+=`\nPreenchido por: ${r.user.nome||r.user.email} (${r.user.email})`;return t}
function texto(r){const S=STAGES[r.st],p=pendentes(r);let t=`CHECKLIST DE CAMPO: ${S.nome.toUpperCase()}\nConcluído em ${fmt(r.fim)}\n`;FIELDS.forEach(([k,l])=>{if(r.info[k])t+=`${l}: ${r.info[k]}\n`});t+=`\nItens conferidos: ${r.ok} de ${r.tot}\n`;S.secoes.forEach((s,si)=>{t+=`\n${s[0]}\n`;s[1].forEach((it,ii)=>t+=`${r.marc[si+'.'+ii]?'[x]':'[ ]'} ${it}\n`)});if(p.length)t+=`\nPENDÊNCIAS (${p.length}):\n${p.map(x=>'- '+x).join('\n')}\n`;if(r.obs)t+=`\nObservações: ${r.obs}\n`;if(r.user)t+=`\nPreenchido por: ${r.user.nome||r.user.email} (${r.user.email})\n`;return t}
function resumo(r,novo){
  const t=texto(r),p=pendentes(r);
  app.innerHTML=`<div class="card" style="margin-top:20px;${p.length?'':'border-color:var(--g)'}"><h3>${novo?'Checklist concluído':STAGES[r.st].nome}<small>${fmt(r.fim)}</small></h3>
  <p style="margin:0 0 8px">${p.length?`<span class="tag w">${p.length} pendência${p.length>1?'s':''}</span>`:'<span class="tag">Todos os itens conferidos</span>'} <span class="mut">${r.ok} de ${r.tot} itens</span></p><p class="mut" id="envst" data-id="${esc(r.id||'')}" style="margin:0 0 8px">${esc(envTxt(r))}</p>
  <pre id="txt">${esc(t)}</pre>
  ${waNum(r)?'':`<p class="err" style="margin:0 0 8px">${r.info.resp?esc(r.info.resp)+' não tem celular cadastrado. Escolha o contato no WhatsApp.':''}</p>`}
  <div class="actions"><a class="btn pri" id="wa" style="flex:1" href="https://wa.me/${waNum(r)}?text=${encodeURIComponent(textoWa(r))}" target="_blank" rel="noopener">${r.wa?'Reenviar':'Enviar'} pelo WhatsApp${r.info.resp?' para '+esc(r.info.resp.split(' ')[0]):''}</a></div>
  <div class="actions"><button class="ghost" id="cp">Copiar relatório completo</button><button class="ghost" id="ini">Voltar ao início</button></div></div>`;
  $('#wa').onclick=()=>{const h=ls.get('cc_hist',[]),x=h.find(y=>y.id===r.id);if(x){x.wa=Date.now();ls.set('cc_hist',h)}r.wa=1};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(t);toast('Relatório copiado')}catch(e){const s=getSelection(),rg=document.createRange();rg.selectNodeContents($('#txt'));s.removeAllRanges();s.addRange(rg);toast('Texto selecionado, copie manualmente')}};
  $('#ini').onclick=home;scrollTo(0,0);
}
recuperacao().then(f=>{if(!f)start()});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
